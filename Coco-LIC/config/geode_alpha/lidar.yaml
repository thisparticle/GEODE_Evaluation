lidar0:
    topic: /velodyne_points
    is_livox: false
    Extrinsics:  # lidar to imu
        time_offset: 0.000
        Trans: [0.010965, -0.086864,  0.060426]
        Rot: [0.9989892,  0.0444870, -0.0064406,  
            -0.0446353,  0.9986885, -0.0250789, 
            0.0053164,  0.0253410,  0.9996647]
num_lidars: 1
lidar_timestamp_end: false  # if the timestamp of a lidar scan is set at the end of the scan

### FeatureExtraction ###
VLP16:  # Velodyne-VLP16
    N_SCAN: 16
    Horizon_SCAN: 1800
    edge_threshold: 1.0
    surf_threshold: 0.1
    odometry_surface_leaf_size: 0.4
    min_distance: 0.5
    max_distance: 200.0

### Odometry ###
use_corner_feature: false
current_scan_param:
    corner_leaf_size: 0.2
    surface_leaf_size: 0.4
    edge_min_valid_num: 10
    surf_min_valid_num: 100
    correspondence_downsample: 1 #2
keyframe_strategy:
    angle_degree: 10
    dist_meter: 1.0
    time_second: 10
map_param:    
    keyframe_search_radius: 50.0
    keyframe_search_time: 10.0
    keyframe_density: 2
    cloud_reserved_time: -1  # [s]